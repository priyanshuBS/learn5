# Daily article writer (cron job).
#
# Runs in GitHub's cloud at 04:00 Asia/Kolkata. For each category the AI picks
# one topic and writes a short article in simple English. Articles that already
# exist are skipped, so the 05:00 back-up run only finishes what failed.
#
# Uses the same secrets as "Generate drops":
#   DATABASE_URL   your Neon connection string
#   GROQ_API_KEY     your Groq API key ("groq-1")
#   RESEND_API_KEY, EMAIL_FROM, ALERT_EMAIL   to email you when anything goes wrong
# Optional variable: GROQ_MODEL (default: openai/gpt-oss-120b)
#
# Run it by hand any time: Actions tab → "Generate articles" → "Run workflow".
name: Generate articles

on:
  schedule:
    # Cron times are UTC. 22:30 UTC = 04:00 IST (next day), 23:30 UTC = 05:00 IST (back-up).
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Only this date (YYYY-MM-DD). Empty = today.'
        required: false
      category:
        description: 'Only this category (e.g. english). Empty = all.'
        required: false

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Write today's articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Problem alerts by email (key limit reached, drops/articles not written, crash)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date=$INPUT_DATE"; fi
          if [ -n "$INPUT_CATEGORY" ]; then ARGS="$ARGS --category=$INPUT_CATEGORY"; fi
          npm run generate-articles -- $ARGS
