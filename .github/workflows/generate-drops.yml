# Daily question generator (cron job).
#
# Runs in GitHub's cloud — your laptop can be off.
# 2 drops per category per day (they open at 04:00 and 16:00 IST).
# Each run fills any missing drops for TODAY and TOMORROW (Asia/Kolkata) and
# skips drops that already exist, so a failed run is finished by the next one.
#
# One-time setup (GitHub → your repo → Settings → Secrets and variables → Actions):
#   DATABASE_URL   your Neon connection string
#   GROQ_API_KEY     your Groq API key ("groq-1")
#   RESEND_API_KEY, EMAIL_FROM, ALERT_EMAIL   to email you when anything goes wrong
# Optional variable: GROQ_MODEL (default: openai/gpt-oss-120b)
#
# Run it by hand any time: Actions tab → "Generate drops" → "Run workflow".
name: Generate drops

on:
  schedule:
    # Cron times are UTC. 22:30 UTC = 04:00 IST (fills today before the first drop at 07:00),
    # 10:30 UTC = 16:00 IST (writes tomorrow's drops, and finishes anything that failed).
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Only this date (YYYY-MM-DD). Empty = today and tomorrow.'
        required: false
      category:
        description: 'Only this category (e.g. reasoning). Empty = all.'
        required: false

# Never run two generators at the same time.
concurrency:
  group: generate-drops
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate missing drops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Problem alerts by email (key limit reached, drops/articles not written, crash)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date=$INPUT_DATE"; fi
          if [ -n "$INPUT_CATEGORY" ]; then ARGS="$ARGS --category=$INPUT_CATEGORY"; fi
          npm run generate-drops -- $ARGS

      # Keep the database small: remove old sign-in codes and ended sessions.
      # Runs even if generating failed.
      - name: Clean up old sign-in data
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cleanup
